spring.application.name=TeamManager

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/teammanager
spring.datasource.username=administrator
spring.datasource.password=administrator_password_123
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 console for easy database access during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL queries in logs (optional, helpful for debugging)
spring.jpa.show-sql=true